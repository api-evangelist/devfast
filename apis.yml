aid: devfast
name: /dev/fast
description: >-
  /dev/fast is an AI-native code forge — code review, deployment infrastructure,
  and hosting rebuilt for the AI era. The product reframes code hosting, review,
  and CI/CD around software written and shipped by agents: an RFC-style review
  surface optimized for human taste and judgement, a multi-agent software factory
  that dispatches, supervises, and merges work from many cloud agents, agent-native
  CI/CD where the agent writes declarative pipeline code testable locally, and a
  fine-grained permission system, with every agent run captured and replayable.
  Founded in 2025, /dev/fast is a Y Combinator Winter 2026 company based in San
  Francisco, currently invite-only. It was added to the API Evangelist network as a
  Y Combinator portfolio lead and enriched from its public surface; no public API,
  developer documentation, or machine-readable specification is published yet.
